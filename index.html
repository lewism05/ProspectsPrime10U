<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospects Prime 10U Baseball</title>
<meta name="description" content="Official stat hub for Prospects Prime 10U Baseball - team and player stats, schedule, lineups and player development.">
<meta name="theme-color" content="#07090C">

<link rel="icon" href="assets/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">

<meta property="og:title" content="Prospects Prime 10U Baseball">
<meta property="og:description" content="Team and player stats, schedule and development for Prospects Prime 10U.">
<meta property="og:image" content="assets/icon-512.png">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css?v=20260829k">
<link rel="stylesheet" href="css/layout.css?v=20260829k">
<link rel="stylesheet" href="css/components.css?v=20260829k">
<link rel="stylesheet" href="css/cards.css?v=20260829k">
</head>
<body>

<div class="app">

  <!-- ============================ TOP NAV ============================ -->
  <header class="topnav">
    <div class="wrap topnav-inner">
      <a class="brand" href="#" id="brandHome">
        <img class="brand-mark" src="assets/mark.png" alt="Prospects Prime">
        <span class="brand-text">
          <span class="brand-name">Prospects Prime</span>
          <span class="brand-sub">10U Baseball</span>
        </span>
      </a>

      <div class="topnav-spacer"></div>

      <div class="topnav-actions">
        <span class="coach-chip hidden" id="coachChip">Coach</span>
        <button class="live-pill" id="livePill" title="Data status - click to refresh">
          <span class="live-dot off" id="liveDot"></span>
          <span class="live-label" id="liveLabel">No data</span>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================ SUB NAV ============================ -->
  <nav class="subnav" id="subnav">
    <div class="wrap subnav-inner" id="subnavInner">
      <button class="navtab active" data-tab="dashboard">Dashboard</button>
      <button class="navtab" data-tab="roster">Roster</button>
      <button class="navtab" data-tab="batting">Batting</button>
      <button class="navtab" data-tab="pitching">Pitching</button>
      <button class="navtab" data-tab="defense">Defense</button>
      <button class="navtab" data-tab="schedule">Schedule</button>
      <button class="navtab" data-tab="development">Development</button>
      <button class="navtab coach-only" data-tab="lineup">Lineup <span class="lock">Coach</span></button>
      <button class="navtab coach-only" data-tab="manage">Manage <span class="lock">Coach</span></button>
    </div>
  </nav>

  <!-- Sample-data warning, injected when fake numbers are loaded -->
  <div id="sampleHost"></div>

  <!-- ============================ HERO ============================ -->
  <section class="hero">
    <div class="wrap hero-inner">
      <img class="hero-logo" src="assets/logo.png" alt="Prospects Prime 10U Baseball">
      <div class="hero-copy">
        <div class="eyebrow" id="heroEyebrow">2026 Season · 10U Travel</div>
        <h1 class="hero-title">Prospects Prime 10U</h1>
        <div class="hero-meta" id="heroMeta"></div>
      </div>
      <div class="hero-record" id="heroRecord"></div>
    </div>
  </section>

  <main class="main">
    <div class="wrap">

      <!-- ==================== STAT WINDOW TOGGLE ==================== -->
      <section class="row gap-12 mt-16" id="windowBar" style="flex-wrap:wrap;justify-content:space-between">
        <div class="row gap-8">
          <span class="eyebrow">Showing</span>
          <div class="seg" id="windowSeg">
            <button class="seg-btn active" data-window="season">Full Season</button>
            <button class="seg-btn" data-window="last_8">Last 8</button>
            <button class="seg-btn" data-window="last_4">Last 4</button>
          </div>
        </div>
        <div class="row gap-8" id="windowNote"></div>
      </section>

      <!-- ==================== DASHBOARD ==================== -->
      <section class="page active" id="page-dashboard">
        <div class="statbar" id="statbar"></div>
        <div id="dashboardBody"></div>
      </section>

      <!-- ==================== ROSTER ==================== -->
      <section class="page" id="page-roster">
        <div class="section-head">
          <div>
            <h2>Roster</h2>
            <div class="section-sub" id="rosterSub"></div>
          </div>
          <div class="seg" id="rosterSort">
            <button class="seg-btn active" data-sort="ops">By OPS</button>
            <button class="seg-btn" data-sort="num">By Number</button>
            <button class="seg-btn" data-sort="name">By Name</button>
          </div>
        </div>
        <div class="grid g-cards" id="rosterGrid"></div>
      </section>

      <!-- ==================== BATTING ==================== -->
      <section class="page" id="page-batting">
        <div id="battingBody"></div>
      </section>

      <!-- ==================== PITCHING ==================== -->
      <section class="page" id="page-pitching">
        <div id="pitchingBody"></div>
      </section>

      <!-- ==================== DEFENSE ==================== -->
      <section class="page" id="page-defense">
        <div id="defenseBody"></div>
      </section>

      <!-- ==================== SCHEDULE ==================== -->
      <section class="page" id="page-schedule">
        <div id="scheduleBody"></div>
      </section>

      <!-- ==================== DEVELOPMENT ==================== -->
      <section class="page" id="page-development">
        <div id="developmentBody"></div>
      </section>

      <!-- ==================== LINEUP (coach) ==================== -->
      <section class="page" id="page-lineup">
        <div id="lineupBody"></div>
      </section>

      <!-- ==================== MANAGE (coach) ==================== -->
      <section class="page" id="page-manage">
        <div id="manageBody"></div>
      </section>

    </div>
  </main>

  <!-- ============================ FOOTER ============================ -->
  <footer class="foot">
    <div class="wrap foot-inner">
      <div class="foot-brand">
        <img src="assets/mark.png" alt="">
        <span>Prospects Prime 10U Baseball · <span id="footSeason">2026</span></span>
      </div>
      <div id="footMeta"></div>
    </div>
  </footer>

</div>

<!-- ============================ PLAYER DRAWER ============================ -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Player detail">
  <div class="drawer-head">
    <button class="drawer-close" id="drawerClose" aria-label="Close">×</button>
    <div class="drawer-id">
      <div class="drawer-num" id="drawerNum">—</div>
      <div>
        <div class="drawer-name" id="drawerName">Player</div>
        <div class="drawer-role" id="drawerRole"></div>
      </div>
    </div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- ============================ MODAL ============================ -->
<div class="modal-scrim" id="modalScrim">
  <div class="modal" role="dialog" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 class="card-title" id="modalTitle">Settings</h3>
      <button class="drawer-close" id="modalClose" style="position:static" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- Chart.js is vendored locally so the site works with no CDN dependency. -->
<script src="vendor/chart.umd.min.js?v=20260829k"></script>
<script src="js/config.js?v=20260829k"></script>
<script src="js/csv.js?v=20260829k"></script>
<script src="js/stats.js?v=20260829k"></script>
<script src="js/store.js?v=20260829k"></script>
<script src="js/drills.js?v=20260829k"></script>
<script src="js/insights.js?v=20260829k"></script>
<script src="js/lineup.js?v=20260829k"></script>
<script src="js/schedule.js?v=20260829k"></script>
<script src="js/gamelog.js?v=20260829k"></script>
<script src="js/charts.js?v=20260829k"></script>
<script src="js/views.js?v=20260829k"></script>
<script src="js/matchup.js?v=20260829k"></script>
<script src="js/cards.js?v=20260829k"></script>
<script src="js/app.js?v=20260829k"></script>
</body>
</html>
