<!DOCTYPE html>
<html lang="en" data-theme="light" data-uniform="home">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospects Prime 10U Baseball</title>
<meta name="description" content="Official stat hub for Prospects Prime 10U Baseball - team and player stats, schedule, lineups and player development.">
<meta name="theme-color" content="#C8102E">

<link rel="icon" href="assets/icon-32.png?v=3" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png?v=3">
<!-- The manifest is what makes "Add to Home screen" use the real icon on
     Android instead of a letter in a circle, and open full-screen. -->
<link rel="manifest" href="manifest.json?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prospects Prime">
<meta name="mobile-web-app-capable" content="yes">

<meta property="og:title" content="Prospects Prime 10U Baseball">
<meta property="og:description" content="Team and player stats, schedule and development for Prospects Prime 10U.">
<meta property="og:image" content="https://prospectsprime10u.netlify.app/assets/icon-512.png?v=3">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css?v=20261027e">
<link rel="stylesheet" href="css/layout.css?v=20261027e">
<link rel="stylesheet" href="css/components.css?v=20261027e">
<link rel="stylesheet" href="css/cards.css?v=20261027e">
<link rel="stylesheet" href="css/season.css?v=20261027e">
<link rel="stylesheet" href="css/uniforms.css?v=20261027e">

<script>
/* Set the uniform before the first paint, so nobody sees a flash of the
   wrong colours. All three uniforms ride on the light layout. */
(function () {
  var d = document.documentElement, u = 'home';
  try { u = localStorage.getItem('prospects10u_v1_uniform') || 'home'; } catch (e) {}
  if (u !== 'home' && u !== 'away' && u !== 'alt') u = 'home';
  d.setAttribute('data-theme', 'light');
  d.setAttribute('data-uniform', u);
})();
</script>
</head>
<body>

<div class="app">

  <!-- ============================ TOP NAV ============================ -->
  <header class="topnav">
    <div class="wrap topnav-inner">
      <a class="brand" href="#" id="brandHome">
        <img class="brand-mark" id="brandMark" src="assets/mark.png" alt="Prospects Prime">
        <span class="brand-text">
          <span class="brand-name">Prospects Prime</span>
          <span class="brand-sub">10U Baseball</span>
        </span>
      </a>

      <div class="topnav-spacer"></div>

      <div class="topnav-actions">
        <span class="coach-chip hidden" id="coachChip">Coach</span>
        <button class="live-pill" id="livePill" title="Data status - click to refresh">
          <span class="live-dot off" id="liveDot"></span>
          <span class="live-label" id="liveLabel">No data</span>
        </button>
        <button class="icon-btn uni-btn" id="themeBtn" title="Switch uniform" aria-label="Switch uniform: Home, Away or Alt"><span class="uni-sw" aria-hidden="true"><i class="sw-home"></i><i class="sw-away"></i><i class="sw-alt"></i></span><span data-u="home">Home</span><span data-u="away">Away</span><span data-u="alt">Alt</span></button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ======================= ROOMS + SUB NAV =======================
       Two rooms, not nine flat tabs. The Dugout is where families live;
       Coaches Corner holds the decisions parents should not have to read.
       ================================================================ -->
  <nav class="subnav" id="subnav">
    <div class="wrap roomrow">
      <div class="rooms" id="roomSwitch">
        <button class="room-btn active" data-room="dugout">The Dugout</button>
        <button class="room-btn" data-room="corner">Coaches Corner <span class="lock">Coach</span></button>
      </div>
    </div>
    <div class="wrap subnav-inner" id="subnavInner">
      <button class="navtab active" data-tab="dashboard" data-room="dugout">Home</button>
      <button class="navtab" data-tab="season" data-room="dugout">Season</button>
      <button class="navtab" data-tab="myplayer" data-room="dugout">My Player</button>
      <button class="navtab" data-tab="roster" data-room="dugout">Roster</button>
      <button class="navtab" data-tab="batting" data-room="dugout">Batting</button>
      <button class="navtab" data-tab="pitching" data-room="dugout">Pitching</button>
      <button class="navtab" data-tab="defense" data-room="dugout">Defense</button>
      <button class="navtab" data-tab="schedule" data-room="dugout">Schedule</button>
      <button class="navtab" data-tab="profile" data-room="dugout">Profile</button>

      <button class="navtab" data-tab="development" data-room="corner">Practice</button>
      <button class="navtab" data-tab="lineup" data-room="corner">Lineup</button>
      <button class="navtab" data-tab="manage" data-room="corner">Manage</button>
    </div>
    <div class="wrap uni-menu" id="uniMenu">
      <span class="uni-menu-label">Uniform</span>
      <div class="uni-seg" role="group" aria-label="Uniform">
        <button type="button" data-u="home"><i class="sw-home" aria-hidden="true"></i>Home</button>
        <button type="button" data-u="away"><i class="sw-away" aria-hidden="true"></i>Away</button>
        <button type="button" data-u="alt"><i class="sw-alt" aria-hidden="true"></i>Alt</button>
      </div>
    </div>
  </nav>

  <!-- Sample-data warning, injected when fake numbers are loaded -->
  <div id="sampleHost"></div>

  <!-- ==================== TEAM STRIP ====================
       The masthead already carries the name on every screen, so this
       does not say it again - it is a scoreboard, not a second title.
       ===================================================== -->
  <section class="hero">
    <div class="wrap hero-inner">
      <img class="hero-logo" id="heroLogo" src="assets/logo.png" alt="Prospects Prime 10U Baseball">
      <div class="hero-copy">
        <h1 class="sr-only">Prospects Prime 10U Baseball</h1>
        <div class="eyebrow" id="heroEyebrow">2026 Season · 10U Travel</div>
        <div class="hero-meta" id="heroMeta"></div>
      </div>
      <div class="hero-record" id="heroRecord"></div>
    </div>
  </section>

  <main class="main">
    <div class="wrap">

      <!-- ==================== STAT WINDOW TOGGLE ==================== -->
      <section class="row gap-12 mt-16" id="windowBar" style="flex-wrap:wrap;justify-content:space-between">
        <div class="row gap-8">
          <span class="eyebrow">Showing</span>
          <div class="seg" id="windowSeg">
            <button class="seg-btn active" data-window="season">Full Season</button>
            <button class="seg-btn" data-window="last_8">Last 8</button>
            <button class="seg-btn" data-window="last_4">Last 4</button>
          </div>
        </div>
        <div class="row gap-8" id="windowNote"></div>
      </section>

      <!-- ==================== DASHBOARD ==================== -->
      <section class="page active" id="page-dashboard">
        <div class="statbar" id="statbar"></div>
        <div id="dashboardBody"></div>
      </section>

      <!-- ==================== SEASON REVIEW ==================== -->
      <section class="page" id="page-season">
        <div id="seasonBody"></div>
      </section>

      <!-- ==================== PROFILE ==================== -->
      <section class="page" id="page-profile">
        <div id="profileBody"></div>
      </section>

      <!-- ==================== ADMIN (site traffic) ==================== -->
      <section class="page" id="page-admin">
        <div id="adminBody"></div>
      </section>

      <!-- ==================== MY PLAYER ==================== -->
      <section class="page" id="page-myplayer">
        <div id="myPlayerBody"></div>
      </section>

      <!-- ==================== ROSTER ==================== -->
      <section class="page" id="page-roster">
        <div class="section-head">
          <div>
            <h2>Roster</h2>
            <div class="section-sub" id="rosterSub"></div>
          </div>
          <div class="seg" id="rosterSort">
            <button class="seg-btn active" data-sort="ops">By OPS</button>
            <button class="seg-btn" data-sort="num">By Number</button>
            <button class="seg-btn" data-sort="name">By Name</button>
          </div>
        </div>
        <div class="grid g-cards" id="rosterGrid"></div>
      </section>

      <!-- ==================== BATTING ==================== -->
      <section class="page" id="page-batting">
        <div id="battingBody"></div>
      </section>

      <!-- ==================== PITCHING ==================== -->
      <section class="page" id="page-pitching">
        <div id="pitchingBody"></div>
      </section>

      <!-- ==================== DEFENSE ==================== -->
      <section class="page" id="page-defense">
        <div id="defenseBody"></div>
      </section>

      <!-- ==================== SCHEDULE ==================== -->
      <section class="page" id="page-schedule">
        <div id="scheduleBody"></div>
      </section>

      <!-- ==================== DEVELOPMENT ==================== -->
      <section class="page" id="page-development">
        <div id="developmentBody"></div>
      </section>

      <!-- ==================== LINEUP (coach) ==================== -->
      <section class="page" id="page-lineup">
        <div id="lineupBody"></div>
      </section>

      <!-- ==================== MANAGE (coach) ==================== -->
      <section class="page" id="page-manage">
        <div id="manageBody"></div>
      </section>

    </div>
  </main>

  <!-- ============================ FOOTER ============================ -->
  <footer class="foot">
    <div class="wrap foot-inner">
      <div class="foot-brand">
        <img id="footMark" src="assets/mark.png" alt="">
        <span>Prospects Prime 10U Baseball · <span id="footSeason">2026</span></span>
      </div>
      <div class="foot-right">
        <span id="footMeta"></span>
        <span id="footWho" class="foot-who"></span>
        <a href="#admin" class="foot-admin" data-goto="admin">Admin</a>
      </div>
    </div>
  </footer>

</div>

<!-- ============================ PLAYER DRAWER ============================ -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Player detail">
  <div class="drawer-head">
    <button class="drawer-close" id="drawerClose" aria-label="Close">×</button>
    <div class="drawer-id">
      <div class="drawer-num" id="drawerNum">—</div>
      <div>
        <div class="drawer-name" id="drawerName">Player</div>
        <div class="drawer-role" id="drawerRole"></div>
      </div>
    </div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- ============================ MODAL ============================ -->
<div class="modal-scrim" id="modalScrim">
  <div class="modal" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 class="card-title" id="modalTitle">Settings</h3>
      <button class="drawer-close" id="modalClose" style="position:static" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- Chart.js is vendored locally so the site works with no CDN dependency. -->
<script src="vendor/chart.umd.min.js?v=20261027e"></script>
<script src="js/config.js?v=20261027e"></script>
<script src="js/csv.js?v=20261027e"></script>
<script src="js/stats.js?v=20261027e"></script>
<script src="js/store.js?v=20261027e"></script>
<script src="js/drills.js?v=20261027e"></script>
<script src="js/insights.js?v=20261027e"></script>
<script src="js/lineup.js?v=20261027e"></script>
<script src="js/schedule.js?v=20261027e"></script>
<script src="js/gamelog.js?v=20261027e"></script>
<script src="js/progress.js?v=20261027e"></script>
<script src="js/charts.js?v=20261027e"></script>
<script src="js/views.js?v=20261027e"></script>
<script src="js/season.js?v=20261027e"></script>
<script src="js/matchup.js?v=20261027e"></script>
<script src="js/myplayer.js?v=20261027e"></script>
<script src="js/cards.js?v=20261027e"></script>
<script src="js/visits.js?v=20261027e"></script>
<script src="js/app.js?v=20261027e"></script>
</body>
</html>
