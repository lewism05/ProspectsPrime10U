[build]
  publish = "."
  command = ""

# team.json must never be cached - it is how new stats reach everyone.
[[headers]]
  for = "/data/team.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The shell should revalidate so deploys land immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Code must revalidate on every load.
# These files are small and they change together. Caching them for a day
# means a deploy can leave a visitor running NEW html against OLD javascript
# until their cache expires - a mix that breaks in ways nobody can reproduce.
# Revalidation costs one 304 per file and is always correct.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Basic hardening.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
